spring:
  application:
    name: adminpersonal-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/adminpersonal}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true

server:
  port: ${PORT:8080}

# IMPORTANTE: todas las claves abajo deben configurarse vía variables de entorno en producción.
# Los defaults son SOLO para desarrollo local y son intencionalmente débiles/genéricos.
# Si arrancas sin las VARs reales, la app fallará el primer cifrado/JWT por longitud insuficiente.
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8081}
  jwt:
    secret: ${JWT_SECRET:CHANGE_ME_dev_only_jwt_secret_must_be_at_least_256_bits_long_replace_in_production}
    access-token-expiration-seconds: 900
    refresh-token-expiration-days: 7
  encryption:
    # 32 bytes base64 → 44 chars. Generar con: openssl rand -base64 32
    master-key: ${ENCRYPTION_MASTER_KEY:mXhU/bFCNadTjLyHutzZ/SJfbChpHWXvfkxOaoF0H1A=}
  ai:
    gemini:
      api-key: ${GEMINI_API_KEY:}
    groq:
      api-key: ${GROQ_API_KEY:}

resend:
  api-key: ${RESEND_API_KEY:}
  from-email: ${RESEND_FROM_EMAIL:noreply@bvazquezj.dev}
  base-url: ${APP_BASE_URL:http://localhost:5173}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /api-docs
